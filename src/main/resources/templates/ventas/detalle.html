<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle de Venta - Fantasía</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #ffe5ec 0%, #c9e4de 50%, #dbcdf0 100%); font-family: 'Fredoka', sans-serif; min-height: 100vh; padding-bottom: 50px; }
        .bubble-card { background: #fff; border-radius: 24px; border: 4px solid #f7d6e0; padding: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .text-purple { color: #6c5ce7; }
        .text-cyan { color: #2bcbba; }
        .btn-outline-purple { border: 1px solid #6c5ce7; color: #6c5ce7; }
        .btn-outline-purple:hover { background: #6c5ce7; color: #fff; }
        .pago-badge { display:inline-flex; align-items:center; gap:6px; font-size:.85rem; font-weight:800; padding:6px 16px; border-radius:50px; color:#fff; }
        .pago-badge.EFECTIVO { background: linear-gradient(135deg, #15803d, #22c55e); }
        .pago-badge.YAPE { background: linear-gradient(135deg, #6d28d9, #a855f7); }
        .pago-badge.PLIN { background: linear-gradient(135deg, #0891b2, #06b6d4); }
        .info-item { background: #f8f7ff; border-radius: 14px; padding: 12px 18px; }
        .info-item .lbl { font-size: .74rem; font-weight: 700; color: #9b8fd6; text-transform: uppercase; letter-spacing: .5px; margin: 0; }
        .info-item .val { font-size: 1rem; font-weight: 700; color: #4b3a8f; margin: 2px 0 0; }
    </style>
</head>
<body>

<div class="container mt-4" style="max-width: 800px;">
    <div class="mb-3">
        <a th:href="@{/ventas/lista}" class="btn btn-outline-secondary btn-sm rounded-pill">
            <i class="fa-solid fa-arrow-left"></i> Volver al Registro de Ventas
        </a>
    </div>

    <div class="bubble-card">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
            <div>
                <h2 class="fw-bold text-purple mb-0">🎉 Detalle de Venta #<span th:text="${venta.id}"></span></h2>
                <p class="text-muted mb-0" th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy - hh:mm a')}"></p>
            </div>
            <span class="pago-badge" th:classappend="${venta.metodoPago}"
                  th:text="${venta.metodoPago.name() == 'YAPE' ? '📱 Yape' : (venta.metodoPago.name() == 'PLIN' ? '🔵 Plin' : '💵 Efectivo')}">
            </span>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="info-item">
                    <p class="lbl">Cliente</p>
                    <p class="val" th:text="${venta.cliente != null ? venta.cliente.nombre : 'Cliente no registrado'}"></p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="info-item">
                    <p class="lbl">Total de la Venta</p>
                    <p class="val text-cyan">S/. <span th:text="${#numbers.formatDecimal(venta.total, 1, 'COMMA', 2, 'POINT')}"></span></p>
                </div>
            </div>
        </div>

        <h5 class="fw-bold text-purple mb-3">Productos</h5>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr><th>Producto</th><th>Cant.</th><th>P. Unit.</th><th>Subtotal</th></tr>
                </thead>
                <tbody>
                    <tr th:each="detalle : ${venta.detalles}">
                        <td th:text="${detalle.producto.nombre}"></td>
                        <td th:text="${detalle.cantidad}"></td>
                        <td>S/. <span th:text="${#numbers.formatDecimal(detalle.precioUnitario, 1, 'COMMA', 2, 'POINT')}"></span></td>
                        <td class="fw-bold">S/. <span th:text="${#numbers.formatDecimal(detalle.subtotal, 1, 'COMMA', 2, 'POINT')}"></span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(venta.detalles)}">
                        <td colspan="4" class="text-center text-muted py-4">No hay productos registrados para esta venta.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
