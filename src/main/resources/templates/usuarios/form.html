<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Piñatería Paraíso de la Fantasía</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #ffe5ec 0%, #c9e4de 50%, #dbcdf0 100%);
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            padding-top: 40px;
        }
        .bubble-card {
            background-color: #ffffff; border-radius: 24px; border: 4px solid #f7d6e0;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.08); position: relative; overflow: hidden;
        }
        .bubble-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8px;
            background: linear-gradient(90deg, #ff99c8, #fcf6bd, #d0f4de, #a9def9, #e4c1f9);
        }
        .text-purple { color: #6c5ce7; }
        .form-control, .form-select { border-radius: 12px; border: 2px solid #e8e5ff; }
        .form-control:focus, .form-select:focus { border-color: #6c5ce7; box-shadow: none; }
        .btn-primary { background-color: #6c5ce7; border: none; border-radius: 50px; }
        .btn-secondary { background-color: #f7d6e0; border: none; border-radius: 50px; color: #6c5ce7; }
        .rol-choice { display: flex; gap: 12px; }
        .rol-card {
            flex: 1; border: 2px solid #e8e5ff; border-radius: 16px; padding: 14px;
            cursor: pointer; text-align: center; transition: all .2s; position: relative;
        }
        .rol-card input { position: absolute; opacity: 0; }
        .rol-card i { font-size: 1.4rem; color: #6c5ce7; }
        .rol-card span { display: block; font-weight: 700; color: #6c5ce7; margin-top: 6px; font-size: .9rem; }
        .rol-card small { display: block; color: #9b8fd6; font-size: .74rem; margin-top: 2px; }
        .rol-card:has(input:checked) { background: #e8e5ff; border-color: #6c5ce7; }
        .form-check-input:checked { background-color: #6c5ce7; border-color: #6c5ce7; }
    </style>
</head>
<body>

<div class="container mt-4">
    <div class="bubble-card p-4 p-md-5" style="max-width:640px;margin:0 auto;">
        <h2 class="fw-bold text-purple mb-4" th:text="${usuario.id == null} ? '🔐 Registrar Nuevo Usuario' : '✏️ Editar Usuario'">Usuario</h2>

        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label fw-semibold">Nombre Completo *</label>
                <input type="text" th:field="*{nombreCompleto}" class="form-control" required placeholder="Ej. Mario Palomino">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Usuario (login) *</label>
                    <input type="text" th:field="*{username}" class="form-control" required placeholder="Ej. mario.palomino"
                           th:readonly="${usuario.id != null}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Contraseña <span th:if="${usuario.id == null}">*</span></label>
                    <input type="password" th:field="*{password}" class="form-control"
                           th:required="${usuario.id == null}"
                           th:placeholder="${usuario.id == null} ? 'Contraseña de acceso' : 'Dejar en blanco para no cambiarla'">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold d-block">Rol *</label>
                <div class="rol-choice">
                    <label class="rol-card">
                        <input type="radio" th:field="*{rol}" value="ADMINISTRADOR" required>
                        <i class="fa-solid fa-crown"></i>
                        <span>Administrador</span>
                        <small>Acceso total al sistema</small>
                    </label>
                    <label class="rol-card">
                        <input type="radio" th:field="*{rol}" value="VENDEDOR" required/>
                        <i class="fa-solid fa-cash-register"></i>
                        <span>Empleado</span>
                        <small>Solo Ventas e Inventario</small>
                    </label>
                </div>
            </div>

            <div class="mb-4 form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" th:field="*{activo}" id="activoSwitch">
                <label class="form-check-label fw-semibold" for="activoSwitch">Cuenta activa (puede iniciar sesión)</label>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a th:href="@{/usuarios}" class="btn btn-secondary px-4 fw-bold">Cancelar</a>
                <button type="submit" class="btn btn-primary px-4 fw-bold">Guardar Datos</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
